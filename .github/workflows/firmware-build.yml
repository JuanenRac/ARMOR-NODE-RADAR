# A.R.M.O.R. - Manual firmware build in the ESP-IDF container (build here, sign locally)
# Copyright (C) 2026 JuanenRac (Electro Hobby 3D)
# GPL-3.0-or-later - see LICENSE
# =============================================================================
# Started by hand only (workflow_dispatch): it never runs on a push or a pull request, because compiling a firmware image in the official ESP-IDF container takes
# many minutes of GitHub Actions time. It builds the universal ("generic") images of THIS node repository with tools/build_node.sh, in PUBLIC mode (no secrets/generic.conf,
# so no fleet secret can get into an image), checks that every image carries the version of armor.project.json and that the fleet secret is empty, and uploads the images,
# SHA256SUMS and a build manifest as one artifact, with a build-provenance attestation.
#
# It uses no signing key and signs nothing: the signature of a release image is a LOCAL step (tools/fetch_and_sign.py downloads the artifact, verifies the attestation and the
# hashes, signs with the key of the owner and, with --publish, publishes the release). With dry_run on (the default) nothing but the artifact is made; with it off a DRAFT release
# with the unsigned files is also prepared. A build that does not finish correctly (failed, cancelled, timed out or skipped without cause) writes the Job Summary, says which job and why,
# and opens (or updates) the issue "build-failed"; a later good build closes it. A build that never finishes is found by build-watchdog.yml (issue "build-stuck").
# The same file is in the five node repositories; it builds the repository it is in.

name: Firmware build (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check only, no draft release"
        type: boolean
        required: true
        default: true
      board:
        description: "Board (empty = the boards of the node: lcd7box for the panel, s3-eth and s3-wifi for the others)"
        type: string
        required: false
        default: ""
      ref:
        description: "Branch, tag or commit of this repository"
        type: string
        required: true
        default: main
      idf_image:
        description: "ESP-IDF container"
        type: string
        required: true
        default: espressif/idf:v5.5.5

permissions:
  contents: read

# One build per ref at a time, and a running build is never cancelled by a newer one (a half-done dry_run=false would leave a draft release behind).
concurrency:
  group: firmware-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      boards: ${{ steps.plan.outputs.boards }}
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Check the inputs
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
          IDF_IMAGE: ${{ inputs.idf_image }}
          REF: ${{ inputs.ref }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::only the owner of the repository ($OWNER) may start this build, not $ACTOR"; exit 1; }
          [[ "$BOARD" =~ ^[a-z0-9][a-z0-9-]{0,31}$ || -z "$BOARD" ]] || { echo "::error::the board must be lowercase letters, digits and dashes"; exit 1; }
          [[ "$IDF_IMAGE" =~ ^espressif/idf:v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::the container must be espressif/idf:vX.Y[.Z]"; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::the ref has characters that a branch, tag or commit does not have"; exit 1; }

      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Make sure the commit belongs to the main branch
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # only code that is already in main is built: a branch or a fork commit that is not in main is refused
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || { echo "::error::the commit $(git rev-parse --short HEAD) is not part of the main branch; merge it first"; exit 1; }
          # the commit built is the one this run was started from (github.sha); the ref input can only confirm it, never choose another commit
          want="$(git rev-parse --verify --quiet "refs/remotes/origin/${REF}^{commit}" || git rev-parse --verify --quiet "refs/tags/${REF}^{commit}" || git rev-parse --verify --quiet "${REF}^{commit}" || true)"
          [ -n "$want" ] && [ "$want" = "$(git rev-parse HEAD)" ] || { echo "::error::the ref $REF is not the commit this run was started from ($(git rev-parse --short HEAD)); start the run from that ref"; exit 1; }

      - name: Work out the boards, the kind and the version
        id: plan
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          manifest = json.load(open("armor.project.json", encoding="utf-8"))
          kind = manifest["name"].removeprefix("ARMOR-NODE-").lower()
          board = os.environ["BOARD"]
          boards = [board] if board else (["lcd7box"] if kind == "hmi" else ["s3-eth", "s3-wifi"])
          print("boards=" + json.dumps(boards))
          print("kind=" + kind)
          print("version=" + manifest["version"])
          PY
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.board }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.plan.outputs.boards) }}
    env:
      BOARD: ${{ matrix.board }}
      KIND: ${{ needs.plan.outputs.kind }}
      VERSION: ${{ needs.plan.outputs.version }}
      IDF_IMAGE: ${{ inputs.idf_image }}
    steps:
      - name: Check out the exact commit that was planned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Make sure the build has no fleet secret to take
        shell: bash
        run: |
          set -euo pipefail
          # secrets/ is git-ignored, so a checkout has none; this stops a future change that would commit one
          if [ -e secrets/generic.conf ]; then
            echo "::error::secrets/generic.conf is in the repository; a public image must not be built with it"
            exit 1
          fi

      - name: Build the image in the ESP-IDF container
        shell: bash
        env:
          ARMOR_IDF_IMAGE: ${{ inputs.idf_image }}
        run: |
          set -euo pipefail
          # the container is limited to the cores of this runner (build_node.sh asks for cores 0-3 by default)
          export ARMOR_BUILD_CPUSET="0-$(( $(nproc) - 1 ))"
          bash tools/build_node.sh generic "$BOARD"

      - name: Check the version in the images and that no fleet secret got in, and name the files
        shell: bash
        run: |
          set -euo pipefail
          complete="dist/generic-$BOARD.bin"
          app="build/generic-$BOARD/armor_$KIND.bin"
          [ -f "$complete" ] || { echo "::error::$complete was not made"; exit 1; }
          [ -f "$app" ] || { echo "::error::$app was not made"; exit 1; }
          for image in "$complete" "$app"; do
            if ! python3 - "$image" "$VERSION" <<'PY'
          import re, sys
          data = open(sys.argv[1], "rb").read()
          sys.exit(0 if re.search(rb"(?<![0-9.])" + re.escape(sys.argv[2].encode()) + rb"(?![0-9])", data) else 1)
          PY
            then
              echo "::error::$image does not carry the version $VERSION of armor.project.json (the version has to be raised BEFORE the build)"
              exit 1
            fi
            echo "version $VERSION found in $image"
          done
          if grep -E '^CONFIG_ARMOR_(FLEET_SECRET|SETUP_CODE)="[^"]+"' "build/generic-$BOARD/sdkconfig" >/dev/null; then
            echo "::error::build/generic-$BOARD/sdkconfig carries a fleet secret or a set-up code: a public image must not"
            exit 1
          fi
          echo "no fleet secret in build/generic-$BOARD/sdkconfig"
          mkdir -p out
          cp "$app" "out/armor-$KIND-$VERSION-$BOARD-publica-app.bin"
          cp "$complete" "out/armor-$KIND-$VERSION-$BOARD-publica-complete.bin"
          {
            echo "### $BOARD: $KIND $VERSION"
            (cd out && sha256sum ./*.bin | sed 's/^/- /')
            echo "- container: \`$IDF_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the images of this board
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parts-${{ matrix.board }}
          path: out/*.bin
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect, attest and prepare the draft
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      KIND: ${{ needs.plan.outputs.kind }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      IDF_IMAGE: ${{ inputs.idf_image }}
    steps:
      - name: Download the images of every board
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: parts-*
          merge-multiple: true
          path: files

      - name: Write SHA256SUMS and the build manifest
        shell: bash
        run: |
          set -euo pipefail
          cd files
          sha256sum ./*.bin | sed 's#  \./#  #' > SHA256SUMS
          python3 - <<'PY'
          import json, os, re
          files = []
          for line in open("SHA256SUMS", encoding="utf-8"):
              digest, name = line.strip().split("  ", 1)
              board = re.match(r"armor-[a-z]+-[0-9.]+-(.+)-publica-(app|complete)\.bin$", name)
              files.append({"name": name, "sha256": digest, "bytes": os.path.getsize(name), "board": board.group(1), "part": board.group(2)})
          json.dump({
              "schema": "armor-build/1", "repository": os.environ["GITHUB_REPOSITORY"], "project": "armor_" + os.environ["KIND"], "version": os.environ["VERSION"],
              "commit": os.environ["SHA"], "built_on": "github-actions", "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "idf_image": os.environ["IDF_IMAGE"], "signed": False, "files": files,
          }, open("build-manifest.json", "w", encoding="utf-8"), indent=2)
          PY
          cat SHA256SUMS

      - name: Attest the provenance of the files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            files/*.bin
            files/SHA256SUMS

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ needs.plan.outputs.kind }}-${{ needs.plan.outputs.version }}
          path: files/*
          if-no-files-found: error
          retention-days: 30

  draft:
    name: Prepare the draft release (needs the approval of the owner)
    if: ${{ !inputs.dry_run }}
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      KIND: ${{ needs.plan.outputs.kind }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-${{ needs.plan.outputs.kind }}-${{ needs.plan.outputs.version }}
          path: files

      - name: Prepare the draft release with the unsigned files
        shell: bash
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::only the owner may prepare a release"; exit 1; }
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::the release $tag already exists: raise the version before a new build"
            exit 1
          fi
          gh release create "$tag" files/* --draft --target "$SHA" --title "${GITHUB_REPOSITORY#*/} $VERSION (unsigned build, to be signed locally)" \
            --notes "Unsigned build made by GitHub Actions. It is signed and published with tools/fetch_and_sign.py; do not install these files before that."
          echo "- draft release \`$tag\` prepared with the unsigned files" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the artifact as a stranger would
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-${{ needs.plan.outputs.kind }}-${{ needs.plan.outputs.version }}
          path: build

      - name: Check hashes, manifest and attestation
        shell: bash
        run: |
          set -euo pipefail
          cd build
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json
          manifest = json.load(open("build-manifest.json", encoding="utf-8"))
          assert manifest["signed"] is False and manifest["files"], "unexpected manifest"
          print("manifest ok:", manifest["project"], manifest["version"], len(manifest["files"]), "files")
          PY
          for file in ./*.bin SHA256SUMS; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/firmware-build.yml" --source-digest "$GITHUB_SHA" >/dev/null
            echo "attestation ok: $file"
          done

  notify:
    name: Tell the owner (issue build-failed)
    if: ${{ always() }}
    needs: [plan, build, collect, draft, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      NEEDS: ${{ toJSON(needs) }}
      REF: ${{ inputs.ref }}
      DRY_RUN: ${{ inputs.dry_run }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the issue build-failed
        id: report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_url = os.environ["RUN_URL"]
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          order = ["plan", "build", "collect", "draft", "verify"]


          def gh(*args, check=True):
              result = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and result.returncode != 0:
                  raise RuntimeError("gh " + " ".join(args[:3]) + " failed: " + result.stderr.strip()[:300])
              return result.stdout


          def write_summary(text):
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(text + "\n")


          try:
              needs = json.loads(os.environ["NEEDS"])
              results = {name: needs.get(name, {}).get("result", "missing") for name in order}
              if os.environ.get("DRY_RUN") == "true" and results.get("draft") == "skipped":
                  results["draft"] = "success"  # a dry run makes no draft on purpose
              bad = {name: result for name, result in results.items() if result != "success"}
              number = gh("issue", "list", "--repo", repo, "--label", "build-failed", "--state", "open", "--json", "number", "--jq", ".[0].number // empty").strip()
              if bad:
                  # what the API knows about each job: conclusion (failure, cancelled, timed_out, skipped), failed step, reason
                  jobs = json.loads(gh("api", f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"))["jobs"]
                  lines = []
                  causes = 0
                  for job in jobs:
                      if job["name"].startswith("Tell the owner"):
                          continue
                      conclusion = job.get("conclusion") or job.get("status")
                      if conclusion in ("success", "skipped") and not any(s.get("conclusion") in ("failure", "cancelled", "timed_out") for s in job.get("steps", [])):
                          continue
                      step = next((s["name"] for s in job.get("steps", []) if s.get("conclusion") in ("failure", "cancelled", "timed_out")), None)
                      reason = ""
                      if conclusion != "skipped":
                          causes += 1
                          annotations = gh("api", f"repos/{repo}/check-runs/{job['id']}/annotations", check=False)
                          try:
                              messages = [a["message"] for a in json.loads(annotations or "[]") if a.get("annotation_level") in ("failure", "error")]
                          except ValueError:
                              messages = []
                          if messages:
                              reason = messages[0].strip().splitlines()[0][:300]
                      what = {"failure": "failed", "cancelled": "was cancelled", "timed_out": "ran out of time", "skipped": "was skipped because an earlier job did not pass"}.get(conclusion, "ended as " + str(conclusion))
                      line = f"- **{job['name']}** {what}"
                      if step:
                          line += f" (step: {step})"
                      if reason:
                          line += f": {reason}"
                      line += f" - {job['html_url']}"
                      lines.append(line)
                  if causes == 0:
                      lines.append("- no job reports a failure, but these ended without success: " + ", ".join(f"{n}={r}" for n, r in bad.items()) + " (a job was skipped without an earlier failure)")
                  body = "\n".join([
                      "The firmware build did not finish correctly.",
                      "",
                      f"Run: {run_url}",
                      f"Ref: `{os.environ.get('REF', '')}`, dry run: {os.environ.get('DRY_RUN', '')}",
                      "Results: " + ", ".join(f"{n}={r}" for n, r in results.items()),
                      "",
                      *lines,
                      "",
                      "Open the run, read the log of the job above, fix the cause and start the workflow again; a later good build closes this issue.",
                  ])
                  write_summary("### The build did not finish correctly\n" + "\n".join(lines))
                  if number:
                      gh("issue", "comment", number, "--repo", repo, "--body", body)
                  else:
                      gh("label", "create", "build-failed", "--repo", repo, "--color", "B60205", "--description", "A firmware build in GitHub Actions failed", check=False)
                      gh("issue", "create", "--repo", repo, "--label", "build-failed", "--title", "Firmware build failed", "--body", body)
                  print("::error::the firmware build did not finish correctly: " + ", ".join(f"{n}={r}" for n, r in bad.items()) + " - " + run_url)
              else:
                  write_summary("### The build passed")
                  if number:
                      gh("issue", "close", number, "--repo", repo, "--comment", f"A later build passed: {run_url}")
          except Exception as error:  # the report itself failed: say so loudly, with the cause
              text = f"{type(error).__name__}: {error}"
              print(f"::error::the notify job could not report the state of the build ({text}). Check the run by hand: {run_url}")
              write_summary(f"### The notify job failed\n\nIt could not open, update or close the issue build-failed.\n\nCause: `{text}`\n\nRun: {run_url}")
              sys.exit(1)
          PY

      - name: Say it if this notify job itself failed
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error::the notify job failed before it could report the build; open the run and read its summary: $RUN_URL"
          echo "### The notify job failed, so the issue build-failed may be missing. Read the log above. Run: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
